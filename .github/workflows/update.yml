name: IPTV自动更新

on:
  schedule:
    - cron: "20 0 * * *"

  workflow_dispatch:

permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # 获取代码
      # ======================================================

      - name: 获取代码

        uses: actions/checkout@v4


      # ======================================================
      # 安装 Python
      # ======================================================

      - name: 安装 Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ======================================================
      # 安装 FFmpeg
      #
      # check.py 使用 ffprobe 检测真实视频分辨率
      # ======================================================

      - name: 安装 FFmpeg

        run: |

          sudo apt-get update

          sudo apt-get install -y ffmpeg


      # ======================================================
      # 自动发现 IPTV 源
      # ======================================================

      - name: 自动发现公开 IPTV 源

        run: |

          python scripts/discover.py


      # ======================================================
      # 检测直播源
      # ======================================================

      - name: 检测直播源

        run: |

          python scripts/check.py


      # ======================================================
      # 生成最终 best.m3u
      # ======================================================

      - name: 生成最佳 IPTV 播放列表

        run: |

          python scripts/build.py


      # ======================================================
      # 保存结果
      # ======================================================

      - name: 保存更新结果

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add output/


          if git diff --cached --quiet; then

            echo "没有新的变化"

          else

            git commit -m "自动更新 IPTV 源"

            git push

          fi
