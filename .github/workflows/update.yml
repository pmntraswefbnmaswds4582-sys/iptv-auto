name: IPTV自动更新

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 自动发现公开 IPTV 源
        run: |
          python scripts/discover.py

      - name: 保存更新结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/discovered.json

          if git diff --cached --quiet; then
            echo "没有新的变化"
          else
            git commit -m "自动更新 IPTV 源"
            git push
          fi
